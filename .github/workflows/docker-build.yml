# .github/workflows/docker-build.yml
name: Build llama.cpp-vulkan

on:
  push:
    paths:
      - "aibox/Dockerfile"
  schedule:
    - cron: '0 3 * * 0' # Weekly build
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Clone llama.cpp repo
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama-src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./llama-src
          file: ./aibox/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/askpng/llamacpp:latest
          target: full